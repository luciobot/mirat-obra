<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mirat Obra</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1C2126"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--paper:#F2F3F0;--sheet:#fff;--ink:#1C2126;--ink-2:#48515A;--ink-3:#7A838C;--rule:#C9CED1;--rule-2:#E4E7E8;--band:#EDEFEE;--som:#1F5C9E;--cam:#C2371F;--rede:#E67816;--cort:#2E7A4C;--en:#7A4C9E;--tv:#6B7680;--wall:#A8600C;--wall-soft:#FBEBD2;--ok:#2E7A4C;--ok-soft:#DCEFE2;--wip:#A8600C;--wip-soft:#FBEBD2;--bar:#1C2126;--bar-ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:16px/1.4 "IBM Plex Sans",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;touch-action:manipulation}
.bar{background:var(--bar);color:var(--bar-ink);padding:8px 12px calc(8px + env(safe-area-inset-top)) 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none}
.bar .ttl{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;margin-right:6px}
.bar .ttl small{font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#B3BBC2;display:block;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid #48515A;border-radius:999px;padding:7px 12px 7px 9px;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#B3BBC2;cursor:pointer;user-select:none;min-height:40px;background:transparent}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip .sw{width:14px;height:14px;border-radius:50%;background:transparent;border:2px solid var(--c);flex:none}
.chip.on{color:#fff;border-color:var(--c);background:rgba(255,255,255,.06)} .chip.on .sw{background:var(--c)}
.chip small{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:#B3BBC2;text-transform:none;letter-spacing:0;font-weight:500;font-variant-numeric:tabular-nums}
.chip.util{border-style:dashed} .chip.util.on{border-color:var(--wall);background:rgba(168,96,12,.2)} .chip.util .sw{border-radius:3px;border-color:var(--wall)} .chip.util.on .sw{background:var(--wall)}
.tools{display:flex;gap:6px;align-items:center}
.btn{appearance:none;border:1.5px solid #48515A;background:transparent;color:#fff;font:600 15px "Barlow Condensed",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:0 14px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.on{background:#fff;color:#1C2126;border-color:#fff}
.search{min-height:40px;border:1.5px solid #48515A;border-radius:8px;background:#2A3139;color:#fff;font:16px "IBM Plex Mono",monospace;padding:0 12px;width:120px}
.search::placeholder{color:#7F8991;font-family:"IBM Plex Sans",sans-serif}
.prog{font-size:13px;color:#B3BBC2;font-variant-numeric:tabular-nums;white-space:nowrap} .prog b{color:#fff;font-size:15px}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px}
@media (max-width:899px){.stage{grid-template-columns:1fr}}
.map{position:relative;background:#fff;overflow:hidden;touch-action:none}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.zoom button{width:46px;height:46px;border-radius:10px;border:1px solid var(--rule);background:#fff;color:var(--ink);font:600 22px "Barlow Condensed",Arial,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
.compass{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;color:#48515A;background:rgba(255,255,255,.92);padding:4px 8px;border:1px solid #D3D7D9;border-radius:6px;max-width:60%}
svg .run{fill:none;stroke-width:6;stroke-linejoin:round;stroke-linecap:round;opacity:.9;pointer-events:none}
svg .lbl{font:600 15px "Barlow Condensed",Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round;pointer-events:none}
svg .pt{cursor:pointer} svg .pt .hit{fill:transparent} svg .pt circle.dot,svg .pt rect.dot{stroke:#fff;stroke-width:2.5}
svg .pt text{font:600 12px "IBM Plex Mono",monospace;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .pt .st{stroke:#fff;stroke-width:2;display:none} svg .pt.done .st,svg .pt.wip .st{display:block} svg .pt.done .dot{opacity:.45} svg .pt.done .st{fill:var(--ok)} svg .pt.wip .st{fill:var(--wip)}
svg .hub rect{fill:#1C2126;stroke:#fff;stroke-width:2} svg .hub text{font:600 14px "Barlow Condensed",Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central} svg .hub{cursor:pointer}
svg .off{display:none}
svg.has-sel .pt:not(.sel){opacity:.3} svg.has-sel .run:not(.sel){opacity:.15} svg.has-sel .lbl:not(.sel){opacity:.12}
svg .run.sel{stroke-width:10;opacity:1} svg .pt.sel .dot{stroke:#1C2126;stroke-width:4}
svg .wallring{fill:none;stroke:#A8600C;stroke-width:3;stroke-dasharray:4 3;pointer-events:none}
svg.wallonly .pt:not(.wall),svg.wallonly .run:not(.wall),svg.wallonly .lbl:not(.wall){display:none}
svg.hidedone .pt.done,svg.hidedone .run.done,svg.hidedone .lbl.done{display:none}
.sheet{background:var(--sheet);border-left:1px solid var(--rule);overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
@media (max-width:899px){.sheet{position:fixed;left:0;right:0;bottom:0;height:58%;border-left:0;border-top:2px solid var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s} .sheet.open{transform:none} .sheet .grab{display:block}}
.sheet .grab{display:none;width:44px;height:5px;border-radius:3px;background:var(--rule);margin:8px auto 0}
.inner{padding:14px 16px 24px}
.ph{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;margin-bottom:10px}
.ph .ico{width:64px;height:64px;background:var(--band);display:grid;place-items:center;color:var(--c);border-radius:8px} .ph .ico svg{width:48px;height:48px}
.ph h2{font-family:"Barlow Condensed",Arial,sans-serif;font-size:24px;font-weight:600;margin:0;line-height:1.05}
.ph .kind{font-size:13px;color:var(--ink-3)} .ph .id{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--c);font-size:14px}
.x{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);width:40px;height:40px;border-radius:8px;font-size:20px;cursor:pointer}
.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0 12px}
.status button{appearance:none;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink-2);font:600 15px "Barlow Condensed",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;min-height:48px;border-radius:8px;cursor:pointer}
.status button.on.pend{border-color:var(--ink);color:var(--ink)} .status button.on.wip{border-color:var(--wip);background:var(--wip-soft);color:var(--wip)} .status button.on.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.stamp{font-size:12.5px;color:var(--ink-3);margin:-6px 0 10px}
.wallflag{display:inline-block;background:var(--wall-soft);color:var(--wall);font:600 13px "Barlow Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-bottom:8px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 10px;font-size:15px} dl.facts dt{color:var(--ink-3);white-space:nowrap} dl.facts dd{margin:0;font-variant-numeric:tabular-nums} dl.facts dd.big{font-family:"Barlow Condensed",Arial,sans-serif;font-size:20px;font-weight:600}
.cut{border:1px solid var(--rule-2);background:var(--paper);margin:10px 0;border-radius:6px;overflow:hidden} .cut svg{display:block;width:100%;height:auto} .cut .cap{font-size:12px;color:var(--ink-3);padding:5px 10px 7px;border-top:1px solid var(--rule-2)}
.obs{font-size:14px;color:var(--ink-2);background:var(--band);padding:8px 10px;border-radius:6px;margin-bottom:10px}
textarea{width:100%;min-height:64px;border:1px solid var(--rule);border-radius:6px;padding:8px;font:15px "IBM Plex Sans",sans-serif;color:var(--ink);background:var(--sheet);resize:vertical}
h3{font-family:"Barlow Condensed",Arial,sans-serif;font-size:17px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.plist{list-style:none;margin:0;padding:0} .plist li.g{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 0 4px;border-bottom:1px solid var(--rule-2);margin-bottom:4px;display:flex;justify-content:space-between}
.plist button{appearance:none;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:9px 6px;display:grid;grid-template-columns:30px 48px 1fr auto;gap:8px;align-items:center;cursor:pointer;border-radius:6px;min-height:48px}
.plist button:active{background:var(--band)} .plist .mi{width:26px;height:26px;color:var(--c)} .plist .mi svg{width:26px;height:26px}
.plist .pid{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--c);font-weight:500} .plist .len{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.plist .sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle;border:1.5px solid var(--rule)} .plist .sd.done{background:var(--ok);border-color:var(--ok)} .plist .sd.wip{background:var(--wip);border-color:var(--wip)}
.plist button.done{color:var(--ink-3);text-decoration:line-through}
.intro{margin:0 0 10px;color:var(--ink-2);font-size:14.5px}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px} .prow .btn2{appearance:none;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);font:600 14px "Barlow Condensed",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:0 12px;min-height:40px;cursor:pointer} .prow .btn2.on{border-color:var(--ink);background:var(--band)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1C2126;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9} .toast.show{opacity:1}

function setStatus(id,st){ST[id]=Object.assign(ST[id]||{},{st,t:new Date().toISOString()});save();paintStatus();if(sel===id)select(id,true);toast(st==='done'?`${id} marcado como feito`:st==='wip'?`${id} em execução`:`${id} pendente`)}
function select(id,keep){sel=id;const p=byId[id];svg.classList.add('has-sel');svg.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));svg.querySelectorAll(`[data-id="${id}"]`).forEach(e=>e.classList.add('sel'));if(!keep)focusOn(p);
 const c=`var(--${p.sys})`,st=stOf(id),rec=ST[id]||{};const when=rec.t?new Date(rec.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 const elet=p.cond?`Ø${p.cond} mm · ${fmt(p.L*1.15*(p.id==='R1b'?2:1))} m com 15 %${p.id==='S9r'?' + Ø32 de reserva':''}${p.id==='R1b'?' (2 eletrodutos)':''}`:'eletroduto existente';
 panel.innerHTML=`<div class="ph" style="--c:${c}"><div class="ico">${icon(p.eq)}</div><div><div class="kind">${SYSN[p.sys]} · ${p.amb}</div><h2>${p.name}</h2><div class="id">${p.id}</div></div><button class="x" id="back" aria-label="fechar">✕</button></div>
 ${p.wall?'<div class="wallflag">Desce pela parede</div>':''}
 <div class="status"><button class="pend ${st===''?'on':''}" data-st="">Pendente</button><button class="wip ${st==='wip'?'on':''}" data-st="wip">Em execução</button><button class="done ${st==='done'?'on':''}" data-st="done">Feito</button></div>
 ${when?`<div class="stamp">Última marcação: ${when}</div>`:''}
 <dl class="facts"><dt>Eletroduto</dt><dd class="big">${elet}</dd><dt>Percurso</dt><dd>${p.approx?'≈ ':''}${fmt(p.L)} m (forro ${p.approx?'≈ ':''}${fmt(p.horiz)} m)</dd><dt>Altura da caixa</dt><dd>${fmt2(p.dest==='W'?2.75:p.h)} m do piso acabado</dd>${p.cot?`<dt>Locação</dt><dd>${p.cot}</dd>`:''}<dt>Termina em</dt><dd>${p.destname} (${fmt2(p.desth)} m)</dd><dt>Cabo (cliente)</dt><dd>${p.cab}</dd></dl>
 ${p.obs?`<div class="obs">${p.obs}</div>`:''}
 <div class="cut">${cut(p)}<div class="cap">Alturas em escala; comprimento no forro fora de escala. Trecho em parede em ocre.</div></div>
 <h3>Anotação da obra</h3><textarea id="note" placeholder="medida real, desvio, foto nº…">${rec.note||''}</textarea>`;
 document.getElementById('back').onclick=clear;panel.querySelectorAll('.status button').forEach(b=>b.onclick=()=>setStatus(id,b.dataset.st));
 document.getElementById('note').addEventListener('change',e=>{ST[id]=Object.assign(ST[id]||{},{note:e.target.value});save()});openSheet();sheet.scrollTop=0;}
function selectHub(h){sel=h.id;svg.classList.remove('has-sel');svg.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));const dests={R1:'R1',S9:'S9',Hall:'R1B',Sw1:'SW1',Sw2:'SW2',Q:'Q'}[h.id];const arr=DATA.pts.filter(p=>p.dest===dests);
 panel.innerHTML=`<div class="ph" style="--c:var(--ink-2)"><div class="ico">${icon(h.eq)}</div><div><div class="kind">Ponto de chegada</div><h2>${h.name}</h2><div class="id">${h.id}</div></div><button class="x" id="back">✕</button></div><h3>${arr.length} eletrodutos chegam aqui</h3><ul class="plist">${arr.map(li).join('')}</ul>`;
 document.getElementById('back').onclick=clear;bindList();openSheet();}
function li(p){const st=stOf(p.id);return `<li><button type="button" data-id="${p.id}" class="${st}" style="--c:var(--${p.sys})"><span class="mi">${icon(p.eq)}</span><span class="pid">${p.id}</span><span>${p.name}<span class="sd ${st}"></span></span><span class="len">${p.approx?'≈ ':''}${fmt(p.L)} m</span></button></li>`}
function bindList(){panel.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}
function showList(){const q=document.getElementById('q').value.trim().toUpperCase();let pts=visible();if(q)pts=DATA.pts.filter(p=>p.id.toUpperCase().includes(q)||p.name.toUpperCase().includes(q));
 const grp={};pts.forEach(p=>(grp[mode==='sys'?SYSN[p.sys]:p.amb]=grp[mode==='sys'?SYSN[p.sys]:p.amb]||[]).push(p));
 let h=`<p class="intro">Toque em um ponto na planta ou na lista. Marque <b>Feito</b> quando o cabo estiver passado, com sobra e etiqueta nas duas pontas.</p><div class="prow"><button class="btn2 ${mode==='list'?'on':''}" data-m="list">Por ambiente</button><button class="btn2 ${mode==='sys'?'on':''}" data-m="sys">Por sistema</button></div><ul class="plist">`;
 for(const g in grp){const d=grp[g].filter(p=>stOf(p.id)==='done').length;h+=`<li class="g"><span>${g}</span><span>${d}/${grp[g].length}</span></li>`+grp[g].map(li).join('')}
 h+='</ul>';if(!pts.length)h=`<p class="intro">Nenhum ponto com esses filtros.</p>`;panel.innerHTML=h;bindList();panel.querySelectorAll('.btn2').forEach(b=>b.onclick=()=>{mode=b.dataset.m;showList()});}
function clear(){sel=null;svg.classList.remove('has-sel');svg.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));showList();if(window.innerWidth<900)closeSheet();}
document.getElementById('q').addEventListener('input',()=>{sel=null;svg.classList.remove('has-sel');showList();const v=document.getElementById('q').value.trim().toUpperCase();if(byId[v]){select(v)}else if(window.innerWidth<900)openSheet()});
document.getElementById('listbtn').onclick=()=>{if(sheet.classList.contains('open')&&!sel&&window.innerWidth<900){closeSheet()}else{clear();openSheet()}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('share').onclick=async()=>{const d=DATA.pts.filter(p=>stOf(p.id)==='done'),w=DATA.pts.filter(p=>stOf(p.id)==='wip'),pend=DATA.pts.filter(p=>!stOf(p.id));
 const lines=[`Mirat Obra · ${new Date().toLocaleString('pt-BR')}`,`Feitos ${d.length}/${DATA.pts.length}`,...(d.length?['',`FEITOS: ${d.map(p=>p.id).join(', ')}`]:[]),...(w.length?[`EM EXECUÇÃO: ${w.map(p=>p.id).join(', ')}`]:[]),...(pend.length?[`PENDENTES: ${pend.map(p=>p.id).join(', ')}`]:[]),...Object.entries(ST).filter(([k,v])=>v.note).map(([k,v])=>`${k}: ${v.note}`)];
 const text=lines.join('\n');try{if(navigator.share){await navigator.share({title:'Mirat Obra',text})}else{await navigator.clipboard.writeText(text);toast('Resumo copiado')}}catch(e){try{await navigator.clipboard.writeText(text);toast('Resumo copiado')}catch(e2){toast('Não foi possível compartilhar')}}};
let sy=0;sheet.querySelector('.grab').addEventListener('pointerdown',e=>{sy=e.clientY});sheet.querySelector('.grab').addEventListener('pointerup',e=>{if(e.clientY-sy>40)closeSheet()});
updLayers();apply();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script></body></html>
